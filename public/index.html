<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Items Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Items Manager</h1>

    <!-- Message area -->
    <div id="status" class="status hidden" role="alert" aria-live="polite"></div>

    <!-- Form -->
    <form id="itemForm" class="form-box" autocomplete="off" novalidate>
      <input type="hidden" id="itemId" />

      <div class="form-row">
        <label for="name">Name</label>
        <input type="text" id="name" maxlength="50" placeholder="Enter item name" required />
      </div>

      <div class="form-row">
        <label for="price">Price</label>
        <input type="number" id="price" min="0" max="10000000" step="0.01" placeholder="Enter price" required />
      </div>

      <div class="form-actions">
        <button type="button" id="cancelBtn" class="btn btn-gray hidden">Cancel</button>
        <button type="submit" id="submitBtn" class="btn btn-primary">Submit</button>
      </div>
    </form>

    <!-- Table -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="itemTableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
